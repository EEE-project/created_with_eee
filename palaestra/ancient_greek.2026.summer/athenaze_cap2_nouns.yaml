# Athenaze Chapter II — noun stems (working "easy" set only).
# APM override preserves the accent of non-oxytone nouns in acc pl (see cap1 note).
# Deferred (don't resolve cleanly with a bare `noun:` stem — see plans/TODO.md):
#   ζυγόν  — oxytone neuter, backend defaults to recessive accent (ζύγον, wrong)
#   σκιά   — 1st-decl fem (long-α), yields 3rd-decl-like garbage (σκίαος)
#   δεσπότης — 1st-decl masc, yields broken δεσπότς
#   σπέρμα — 3rd-decl (-ματ-);  βοῦς — irregular 3rd-decl

# 2nd declension neuter (o-stem) — recessive accent, acc pl = nom pl
ἄροτρον:
    stems:
        noun: ἀροτρο

κέντρον:
    stems:
        noun: κεντρο

# 2nd declension feminine (o-stem) — paroxytone, APM override for acc pl accent
ῥάβδος:
    stems:
        noun: ῥαβδο
    forms:
        APM: ῥάβδους
