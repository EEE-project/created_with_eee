# Athenaze Chapter II — noun stems.
# APM override preserves the accent of non-oxytone nouns in acc pl (see cap1 note).

# 2nd declension neuter (o-stem) — recessive accent, acc pl = nom pl
ἄροτρον:
    stems:
        noun: ἀροτρο

κέντρον:
    stems:
        noun: κεντρο

# 2nd declension neuter (o-stem) — oxytone throughout, unlike the recessive
# pair above; a bare `noun:` stem defaults every cell to recessive accent
# (ζύγον, ζύγου, ...) since the engine only applies persistent/lemma accent
# to non-neuter nominals (see greek-inflexion-eee accent.py). Full forms:
# override instead, sourced from the Morpheus-confirmed data already used
# by the "morpheus"/"palaestra_morpheus" lexicons (accent normalized to
# citation-form acute on NSN; Morpheus's own corpus attestation has grave,
# correct for that word's original mid-sentence position but not for an
# isolated paradigm-table citation).
ζυγόν:
    forms:
        NSN: ζυγόν
        GSN: ζυγοῦ
        DSN: ζυγῷ
        ASN: ζυγόν
        NPN: ζυγά
        GPN: ζυγῶν
        DPN: ζυγοῖς
        APN: ζυγά

# 2nd declension feminine (o-stem) — paroxytone, APM override for acc pl accent
ῥάβδος:
    stems:
        noun: ῥαβδο
    forms:
        APM: ῥάβδους

# 1st declension feminine, long alpha after iota — the stem rules give 6 of 8 cells, so only GSF and DSF are given
σκιά:
    stems:
        noun: σκια
    forms:
        GSF: σκιᾶς
        DSF: σκιᾷ

# 1st declension masculine, paroxytone -ης — the stem rules force an oxytone accent, so every cell is given
δεσπότης:
    forms:
        NSM: δεσπότης
        GSM: δεσπότου
        DSM: δεσπότῃ
        ASM: δεσπότην
        NPM: δεσπόται
        GPM: δεσποτῶν
        DPM: δεσπόταις
        APM: δεσπότας

# 3rd declension neuter, stem in -ματ- — the stem gives 6 of 8 cells, so only NSN and ASN are given (as for σῶμα in the Pratt lexicon)
σπέρμα:
    stems:
        noun: σπερματ
    forms:
        NSN: σπέρμα
        ASN: σπέρμα

# 3rd declension, irregular stem — every cell is given (all eight confirmed against Perseids Morpheus)
βοῦς:
    forms:
        NSM: βοῦς
        GSM: βοός
        DSM: βοΐ
        ASM: βοῦν
        NPM: βόες
        GPM: βοῶν
        DPM: βουσί(ν)
        APM: βοῦς
