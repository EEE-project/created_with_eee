<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ελληνικά Β — Έχει ο καιρός γυρίσματα</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --border: #e0e0e0;
      --accent: #003d82;
      --accent2: #5f27cd;
      --text: #1a1a1a;
      --muted: #666666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
    }

    /* ── Loading screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden { opacity: 0; visibility: hidden; }

    .logo-wrap { position: relative; width: 72px; height: 72px; }

    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 1.2s linear infinite;
    }

    .logo-ring:nth-child(2) {
      inset: 8px;
      border-top-color: var(--accent2);
      border-right-color: var(--accent);
      animation-direction: reverse;
      animation-duration: 1.8s;
    }

    .logo-dot {
      position: absolute;
      inset: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.7; }
    }

    .loader-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .loader-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      height: 48px;
      background: #f5f5f5;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .tb-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: rgba(0,61,130,0.06);
      border: 1px solid rgba(0,61,130,0.12);
      color: var(--accent);
      text-decoration: none;
      font-size: 16px;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .tb-back:active {
      background: rgba(0,61,130,0.12);
      border-color: rgba(0,61,130,0.25);
    }

    .tb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    .tb-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 1;
      color: var(--text);
      text-decoration: none;
    }

    .tb-badge {
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(0,61,130,0.08);
      border: 1px solid rgba(0,61,130,0.3);
      border-radius: 4px;
      padding: 4px 8px;
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    /* ── iFrame ── */
    #notebook-frame {
      position: fixed;
      top: 48px; left: 0; right: 0; bottom: 40px;
      border: none;
      width: 100%;
      height: calc(100% - 88px);
      background: #fff;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #notebook-frame.visible { opacity: 1; }

    /* ── Error state ── */
    #error-state {
      display: none;
      position: fixed;
      inset: 48px 0 40px 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    #error-state.show { display: flex; }

    .err-icon { font-size: 48px; opacity: 0.5; }
    .err-title { font-size: 18px; font-weight: 700; }
    .err-msg { font-size: 13px; color: var(--muted); max-width: 280px; line-height: 1.6; }

    .err-btn {
      margin-top: 8px;
      padding: 10px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.15s, opacity 0.15s;
    }

    .err-btn:active { transform: scale(0.96); opacity: 0.85; }

    /* ── Footer ── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      height: 40px;
      background: #f5f5f5;
      border-top: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
    }

    .footer-link {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-decoration: none;
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D9SLECHKZL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-D9SLECHKZL');
  </script>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo-dot"></div>
    </div>
    <div class="loader-title">🌤️ Chapter 8</div>
    <div class="loader-label">Έχει ο καιρός γυρίσματα</div>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <a class="tb-back" href="ellinika-index.html">&#9664;</a>
    <a class="tb-title" href="ellinika-index.html">Ελληνικά Β</a>
    <a class="tb-badge" href="#" onclick="openTelegramGroup(); return false;">EEE Community</a>
  </div>

  <!-- Notebook iframe -->
  <iframe
    id="notebook-frame"
    src="https://molab.marimo.io/notebooks/nb_mJ76WxM9YtrDVkxtFpHaGx/app"
    allow="fullscreen; clipboard-read; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
    title="Ελληνικά Β — Chapter 8: Έχει ο καιρός γυρίσματα"
  ></iframe>

  <!-- Error fallback -->
  <div id="error-state">
    <div class="err-icon">⚡</div>
    <div class="err-title">Couldn't load notebook</div>
    <div class="err-msg">The notebook may require a browser login or is temporarily unavailable.</div>
    <button class="err-btn" onclick="retryLoad()">Try again</button>
    <button class="err-btn" style="background: var(--surface); color: var(--text); border: 1px solid var(--border);" onclick="openExternal()">Open in browser</button>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span style="font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text); margin-right: 8px;">Source:</span>
    <a class="footer-link" href="https://codeberg.org/EEE-project/created_with_eee" target="_blank">codeberg.org/EEE-project/created_with_eee</a>
  </div>

  <script>
    const NOTEBOOK_URL = 'https://molab.marimo.io/notebooks/nb_mJ76WxM9YtrDVkxtFpHaGx/app';
    const frame = document.getElementById('notebook-frame');
    const loader = document.getElementById('loader');
    const errorState = document.getElementById('error-state');

    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#ffffff');
      tg.setBackgroundColor('#ffffff');
    }

    let loadTimer = setTimeout(showError, 60000);

    frame.addEventListener('load', () => {
      clearTimeout(loadTimer);
      setTimeout(() => {
        loader.classList.add('hidden');
        frame.classList.add('visible');
      }, 600);
    });

    frame.addEventListener('error', () => { clearTimeout(loadTimer); showError(); });

    function showError() {
      loader.classList.add('hidden');
      errorState.classList.add('show');
    }

    function retryLoad() {
      errorState.classList.remove('show');
      loader.classList.remove('hidden');
      frame.classList.remove('visible');
      loadTimer = setTimeout(showError, 60000);
      frame.src = NOTEBOOK_URL + '?t=' + Date.now();
    }

    function openExternal() {
      if (window.Telegram?.WebApp?.openLink) window.Telegram.WebApp.openLink(NOTEBOOK_URL);
      else window.open(NOTEBOOK_URL, '_blank');
    }

    function openTelegramGroup() {
      const url = 'https://t.me/+VuocC5la3ZwyNDky';
      if (window.Telegram?.WebApp) window.Telegram.WebApp.openLink(url);
      else window.open(url, '_blank');
    }
  </script>
</body>
</html>
