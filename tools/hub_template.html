<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>{{TITLE}}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg: #ffffff; --surface: #f8f9fa; --border: #e0e0e0;
      --accent: #003d82; --accent2: #8b2500; --text: #1a1a1a; --muted: #666666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 48px; background: #f5f5f5; border-bottom: 2px solid var(--accent);
      display: flex; align-items: center; padding: 0 12px; gap: 8px;
    }
    .tb-back { font-size: 15px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 4px 6px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-badge {
      font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700;
      color: var(--accent); background: rgba(0,61,130,0.08); border: 1px solid rgba(0,61,130,0.3);
      border-radius: 4px; padding: 4px 8px; letter-spacing: 0.1em; text-decoration: none;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.85); opacity: 0.7; } }

    .content { padding: 72px 20px 32px; max-width: 480px; margin: 0 auto; }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero-series { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; }
    .hero-title { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .hero-subtitle { font-size: 15px; color: var(--muted); line-height: 1.6; }

    .cards { display: flex; flex-direction: column; gap: 16px; }
    .card { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s; }
    .card:active { transform: scale(0.98); }
    .card:hover { border-color: rgba(0,61,130,0.25); box-shadow: 0 0 20px rgba(0,61,130,0.06); }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .card-icon { font-size: 22px; font-weight: 800; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(0,61,130,0.06); border-radius: 10px; flex-shrink: 0; color: var(--accent); }
    .card-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px; }
    .card-title { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
    .card-greek { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); margin-top: 2px; }
    .card-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .card-arrow { display: flex; align-items: center; justify-content: flex-end; margin-top: 12px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent2); letter-spacing: 0.1em; }

    .footer { text-align: center; margin-top: 40px; padding-bottom: 20px; }
    .footer-link { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.05em; text-decoration: none; }

    #lang-selector { position: fixed; top: 60px; right: 10px; z-index: 1000; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D9SLECHKZL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-D9SLECHKZL');
  </script>
</head>
<body>

  <div id="topbar">
    <a class="tb-back" href="{{BACK_HREF}}" id="tb-back">&#9664; All Courses</a>
    <a class="tb-badge" href="#" onclick="openTelegramGroup(); return false;">EEE Community</a>
  </div>

  <select id="lang-selector" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="el">Ελληνικά</option>
  </select>

  <div class="content">
    <div class="hero">
      <div class="hero-series" id="hero-series">{{HERO_SERIES_EN}}</div>
      <div class="hero-title" id="hero-title">{{HERO_TITLE_EN}}</div>
      <div class="hero-subtitle" id="hero-subtitle">{{HERO_SUBTITLE_EN}}</div>
    </div>

    <div class="cards">
{{CARDS_HTML}}
    </div>

    <div class="footer">
      <div style="font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text); margin-bottom: 4px;">
        <span id="footer-label">Source:</span>
        <a class="footer-link" href="https://codeberg.org/EEE-project/" target="_blank">codeberg.org/EEE-project/</a>
      </div>
    </div>
  </div>

  <script>
    const LANG_STORAGE_KEY = 'gsc-lang';
    const TRANSLATIONS = {
      en: {
        tbBack:      '◀ All Courses',
        series:      {{HERO_SERIES_EN_JS}},
        heroTitle:   {{HERO_TITLE_EN_JS}},
        heroSubtitle:{{HERO_SUBTITLE_EN_JS}},
        footerLabel: 'Source:'{{CARDS_TRANSLATIONS_EN}}
      },
      ru: {
        tbBack:      '◀ Все курсы',
        series:      {{HERO_SERIES_RU_JS}},
        heroTitle:   {{HERO_TITLE_RU_JS}},
        heroSubtitle:{{HERO_SUBTITLE_RU_JS}},
        footerLabel: 'Исходный код:'{{CARDS_TRANSLATIONS_RU}}
      },
      el: {
        tbBack:      '◀ Όλα τα μαθήματα',
        series:      {{HERO_SERIES_EL_JS}},
        heroTitle:   {{HERO_TITLE_EL_JS}},
        heroSubtitle:{{HERO_SUBTITLE_EL_JS}},
        footerLabel: 'Πηγαίος κώδικας:'{{CARDS_TRANSLATIONS_EL}}
      }
    };

    const ELS = {
      tbBack:       document.getElementById('tb-back'),
      series:       document.getElementById('hero-series'),
      heroTitle:    document.getElementById('hero-title'),
      heroSubtitle: document.getElementById('hero-subtitle'),
      footerLabel:  document.getElementById('footer-label'),
      langSelector: document.getElementById('lang-selector')
    };
{{CARDS_ELS_JS}}

    function updateLanguage(lang) {
      const t = TRANSLATIONS[lang];
      for (const k in t) { if (ELS[k]) ELS[k].textContent = t[k]; }
      ELS.langSelector.value = lang;
      localStorage.setItem(LANG_STORAGE_KEY, lang);
    }

    function changeLanguage(lang) { updateLanguage(lang); }

    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready(); tg.expand();
      tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff');
    }

    let currentLang = localStorage.getItem(LANG_STORAGE_KEY);
    if (!currentLang || !TRANSLATIONS[currentLang]) currentLang = 'en';
    updateLanguage(currentLang);

    function openTelegramGroup() {
      const url = 'https://t.me/+VuocC5la3ZwyNDky';
      if (window.Telegram?.WebApp) window.Telegram.WebApp.openLink(url);
      else window.open(url, '_blank');
    }
  </script>
</body>
</html>
